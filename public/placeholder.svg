<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="foodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED" />
      <stop offset="100%" stop-color="#FFEDD5" />
    </linearGradient>
    <linearGradient id="foodIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F47B20" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#foodBg)"/>
  <rect width="98" height="98" x="1" y="1" rx="19" fill="none" stroke="#FED7AA" stroke-width="2"/>
  
  <!-- Food Cloche / Plate Graphic -->
  <g transform="translate(18, 18) scale(0.64)">
    <!-- Base Plate -->
    <ellipse cx="50" cy="74" rx="42" ry="7" fill="#FDBA74" opacity="0.6"/>
    <ellipse cx="50" cy="71" rx="40" ry="6" fill="url(#foodIconGrad)"/>
    <path d="M 12 70 Q 50 78 88 70 Q 50 82 12 70 Z" fill="#C2410C" opacity="0.4"/>
    
    <!-- Food Dome / Cloche Cover -->
    <path d="M 18 67 C 18 35, 82 35, 82 67 Z" fill="url(#foodIconGrad)"/>
    <path d="M 24 65 C 26 42, 46 38, 46 38 C 30 42, 25 55, 24 65 Z" fill="#FFFFFF" opacity="0.35"/>
    
    <!-- Cloche Handle -->
    <ellipse cx="50" cy="33" rx="7" ry="5" fill="#C2410C"/>
    <circle cx="50" cy="30" r="5" fill="url(#foodIconGrad)"/>
    <circle cx="48.5" cy="28.5" r="1.5" fill="#FFFFFF" opacity="0.6"/>
    
    <!-- Steam Lines -->
    <path d="M 40 18 Q 43 14 39 10" fill="none" stroke="#FB923C" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 50 16 Q 54 11 50 7" fill="none" stroke="#FB923C" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 60 18 Q 63 14 59 10" fill="none" stroke="#FB923C" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
